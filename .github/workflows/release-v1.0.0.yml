name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify userscript syntax
        run: node --check src/ai-tab-status.user.js

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 -m "AI Tab Status v1.0.0"
          git push origin v1.0.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## AI Tab Status v1.0.0

          First public release of AI Tab Status.

          ### Highlights

          - Live tab favicon status for ChatGPT and Claude
          - Grey = ready, orange = working, green = finished
          - Completion sound when the AI is actually done
          - Claude Code Web / Remote Control support
          - Detects Claude Code background tasks to avoid false completion alerts
          - Firefox support
          - Brave, Chrome, Edge and Chromium support
          - One universal userscript for all supported browsers
          - No tab-title modification
          - No analytics, tracking, external APIs, or conversation data collection

          ### Install

          Install Tampermonkey or Violentmonkey, then open:

          https://raw.githubusercontent.com/LimitlessLtdd/ai-tab-status/main/src/ai-tab-status.user.js

          ### Notes

          AI web interfaces can change without notice. If a status detector stops working, please open an issue with the affected browser/interface and, when possible, the relevant DOM marker.
          EOF

          gh release create v1.0.0 \
            --title "AI Tab Status v1.0.0" \
            --notes-file release-notes.md \
            --verify-tag
